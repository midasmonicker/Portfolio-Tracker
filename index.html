<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Scanner Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-top: 20px; }
    .card { background: #1e293b; border-radius: 8px; padding: 16px; border: 1px solid #334155; }
    .ticker { font-size: 1.4rem; font-weight: bold; color: #4ade80; }
    .status { text-align: center; font-style: italic; color: #94a3b8; margin-top: 20px; }
    button { display: block; margin: 0 auto 20px; background: #0284c7; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Live Stock Picks</h1>
    <button onclick="fetchPicks()">Refresh Picks</button>
    <div id="status" class="status">Loading picks...</div>
    <div id="picks-container" class="card-grid"></div>
  </div>

<script>
  const API_URL = "https://portfolio-tracker-3ydj.onrender.com/api/picks";

  async function fetchPicks() {
    const statusEl = document.getElementById("status");
    const containerEl = document.getElementById("picks-container");
    
    statusEl.textContent = "Fetching data from Render...";
    containerEl.innerHTML = "";

    try {
      const response = await fetch(API_URL);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data = await response.json();
      console.log("API Payload received:", data);

      const rawPicks = Array.isArray(data) ? data : (data.picks || []);
      
      if (!Array.isArray(rawPicks) || rawPicks.length === 0) {
        statusEl.textContent = "No stock picks found.";
        return;
      }
      
      const validPicks = rawPicks.filter(p => p && p.scan_date);
      if (validPicks.length === 0) {
        statusEl.textContent = "No picks with valid scan dates found.";
        return;
      }

      const latestDate = validPicks.reduce(
        (max, p) => (p.scan_date > max ? p.scan_date : max), 
        validPicks[0].scan_date
      );
      
      const picks = validPicks.filter(p => p.scan_date === latestDate);
      statusEl.textContent = `Showing latest picks for ${latestDate}`;

      picks.forEach(pick => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="ticker">${pick.symbol || "N/A"}</div>
          <p><strong>Price:</strong> ${pick.price !== undefined ? "$" + pick.price : "N/A"}</p>
          <p><strong>Volume Multiple:</strong> ${pick.vol_multiple !== undefined ? pick.vol_multiple + "x" : "N/A"}</p>
          <p><strong>Change:</strong> ${pick.pct_change !== undefined ? pick.pct_change + "%" : "N/A"}</p>
          <p><strong>Scan Date:</strong> ${pick.scan_date || "N/A"}</p>
        `;
        containerEl.appendChild(card);
      });

    } catch (error) {
      console.error("Fetch error detailed:", error);
      statusEl.textContent = "Failed to load picks. Open browser Developer Tools (F12) -> Console to inspect errors.";
    }
  }

  fetchPicks();
</script>
</body>
</html>
